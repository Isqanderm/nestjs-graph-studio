name: Release & Publish

on:
  push:
    tags:
      - 'v*.*.*'  # Trigger on version tags like v1.0.0, v1.2.3, etc.

# Explicit permissions following least privilege principle
permissions:
  contents: write  # For creating GitHub releases
  id-token: write  # For npm provenance

jobs:
  # Job 1: Validate Release
  validate:
    name: Validate Release
    runs-on: ubuntu-latest
    timeout-minutes: 10

    outputs:
      version: ${{ steps.get-version.outputs.version }}
      tag: ${{ steps.get-version.outputs.tag }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Get version from tag
        id: get-version
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          VERSION=${TAG#v}
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Release tag: $TAG"
          echo "Version: $VERSION"

      - name: Verify package.json version matches tag
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${{ steps.get-version.outputs.version }}"
          
          if [ "$PACKAGE_VERSION" != "$TAG_VERSION" ]; then
            echo "❌ Error: package.json version ($PACKAGE_VERSION) does not match tag version ($TAG_VERSION)"
            exit 1
          fi
          
          echo "✅ Version match confirmed: $PACKAGE_VERSION"

      - name: Verify CHANGELOG.md has entry for this version
        run: |
          VERSION="${{ steps.get-version.outputs.version }}"
          
          if grep -q "## \[$VERSION\]" CHANGELOG.md; then
            echo "✅ CHANGELOG.md has entry for version $VERSION"
          else
            echo "⚠️ Warning: CHANGELOG.md does not have entry for version $VERSION"
            echo "Please update CHANGELOG.md before releasing"
          fi

  # Job 2: Run Tests
  test:
    name: Run Full Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: validate

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run backend tests
        run: npm run test:coverage

      - name: Run UI tests
        run: npm run test:ui:coverage

      - name: Verify coverage thresholds
        run: |
          echo "Verifying coverage thresholds..."
          
          # Backend coverage check
          node -e "
            const fs = require('fs');
            const summary = JSON.parse(fs.readFileSync('coverage/coverage-summary.json', 'utf8'));
            const total = summary.total;
            
            if (total.lines.pct < 90) {
              console.error('❌ Backend coverage below 90%');
              process.exit(1);
            }
            console.log('✅ Backend coverage: ' + total.lines.pct + '%');
          "
          
          # UI coverage check
          node -e "
            const fs = require('fs');
            const summary = JSON.parse(fs.readFileSync('ui/coverage/coverage-summary.json', 'utf8'));
            const total = summary.total;
            
            if (total.lines.pct < 70) {
              console.error('❌ UI coverage below 70%');
              process.exit(1);
            }
            console.log('✅ UI coverage: ' + total.lines.pct + '%');
          "

  # Job 3: Build
  build:
    name: Build Package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build package
        run: npm run build

      - name: Verify build artifacts
        run: |
          echo "Verifying build artifacts..."
          
          # Check that all required files exist
          test -f dist/index.js || (echo "❌ Missing dist/index.js" && exit 1)
          test -f dist/index.mjs || (echo "❌ Missing dist/index.mjs" && exit 1)
          test -f dist/index.d.ts || (echo "❌ Missing dist/index.d.ts" && exit 1)
          test -f dist/ui/index.html || (echo "❌ Missing dist/ui/index.html" && exit 1)
          
          echo "✅ All build artifacts present"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-build
          path: dist/
          retention-days: 7

  # Job 4: Publish to npm
  publish-npm:
    name: Publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    environment: npm-publish  # Use GitHub environment for additional protection

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Trusted publishing (OIDC) needs npm CLI >= 11.5.1 — newer than what
      # Node 22's bundled npm may ship, so upgrade explicitly rather than
      # relying on whatever setup-node happened to install.
      - name: Ensure npm supports trusted publishing (OIDC)
        run: npm install -g npm@latest

      - name: Build package
        run: npm run build

      # No NPM_TOKEN / NODE_AUTH_TOKEN needed: this repo's package is
      # configured as a Trusted Publisher on npmjs.com for this exact
      # workflow (release.yml) + environment (npm-publish), so npm
      # authenticates the publish via the OIDC token that `id-token: write`
      # (declared at the top of this workflow) lets this job mint.
      - name: Publish to npm
        run: npm publish --provenance --access public

      - name: Verify publication
        run: |
          VERSION="${{ needs.validate.outputs.version }}"
          if [ -z "$VERSION" ]; then
            VERSION=$(node -p "require('./package.json').version")
            echo "⚠️ needs.validate.outputs.version was empty (e.g. a partial rerun) — falling back to package.json: $VERSION"
          fi

          MAX_ATTEMPTS=18
          SLEEP_SECONDS=10
          echo "Waiting for nestjs-graph-studio@$VERSION to propagate on npm..."

          for i in $(seq 1 "$MAX_ATTEMPTS"); do
            PUBLISHED_VERSION=$(npm view nestjs-graph-studio@"$VERSION" version 2>/dev/null || true)
            if [ "$PUBLISHED_VERSION" = "$VERSION" ]; then
              echo "✅ Package nestjs-graph-studio@$VERSION is live on npm"
              exit 0
            fi
            echo "Attempt $i/$MAX_ATTEMPTS: not yet available, retrying in ${SLEEP_SECONDS}s..."
            sleep "$SLEEP_SECONDS"
          done

          echo "❌ nestjs-graph-studio@$VERSION did not become available on npm after $((MAX_ATTEMPTS * SLEEP_SECONDS)) seconds"
          exit 1

  # Job 5: Create GitHub Release
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [validate, publish-npm]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-build
          path: dist/

      - name: Extract changelog for this version
        id: changelog
        run: |
          VERSION="${{ needs.validate.outputs.version }}"
          
          # Extract changelog section for this version
          awk "/## \[$VERSION\]/,/## \[/" CHANGELOG.md | sed '$d' > release-notes.md
          
          # If no specific changelog found, use a default message
          if [ ! -s release-notes.md ]; then
            echo "Release $VERSION" > release-notes.md
            echo "" >> release-notes.md
            echo "See [CHANGELOG.md](CHANGELOG.md) for details." >> release-notes.md
          fi
          
          cat release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.validate.outputs.tag }}
          name: Release ${{ needs.validate.outputs.version }}
          body_path: release-notes.md
          draft: false
          prerelease: false
          files: |
            dist/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Release summary
        run: |
          echo "# 🎉 Release Published Successfully!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${{ needs.validate.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "**Tag:** ${{ needs.validate.outputs.tag }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 📦 Published To:" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ npm: https://www.npmjs.com/package/nestjs-graph-studio/v/${{ needs.validate.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ GitHub Releases: https://github.com/${{ github.repository }}/releases/tag/${{ needs.validate.outputs.tag }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 📝 Installation:" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "npm install nestjs-graph-studio@${{ needs.validate.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

